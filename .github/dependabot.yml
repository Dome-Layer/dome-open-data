# Dependency policy: dome-docs/compliance/DEPENDENCY_POLICY.md. Alerts stay on;
# pip version-update PRs are off (limit 0), CI's pip-audit gates the shipped lock.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

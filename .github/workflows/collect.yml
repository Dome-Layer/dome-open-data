# Manual collection of one registry source into R2, then an independent
# check that the clean row count matches the raw files. Session 3 adds the
# cadence schedules; until then this is the only way a run starts in CI.

name: collect

on:
  workflow_dispatch:
    inputs:
      source:
        description: Registry id from sources.yaml
        required: true
        default: worldbank_wdi
      force:
        description: Collect even if the change signal is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      SOURCE: ${{ inputs.source }}
      FORCE: ${{ inputs.force }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m dome_open_data run "$SOURCE" --force
          else
            python -m dome_open_data run "$SOURCE"
          fi
      - name: Verify latest vintage
        run: python -m dome_open_data verify "$SOURCE"

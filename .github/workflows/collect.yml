# Manual collection of one registry source into R2, then an independent
# check that the clean row count matches the raw files. The schedules live in
# collect-daily/weekly/monthly/yearly.yml; this one collects a single source on
# demand, for example the first run of a newly added entry.

name: collect

on:
  workflow_dispatch:
    inputs:
      source:
        description: Registry id from sources.yaml
        required: true
        default: worldbank_wdi
      force:
        description: Collect even if the change signal is unchanged
        type: boolean
        default: false
      series:
        description: ALFRED only, optional. One series code (for example GDPC1) to backfill alone
        required: false
        default: ''
      recheck:
        description: ALFRED only. Held publication dates to fetch again and hash-check
        type: choice
        options: [latest, none, all]
        default: latest

permissions:
  contents: read

concurrency:
  group: collect-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # An ALFRED backfill is one run: about 2.5 requests a second, so 1,500 dates in ~15 min.
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      SOURCE: ${{ inputs.source }}
      FORCE: ${{ inputs.force }}
      SERIES: ${{ inputs.series }}
      RECHECK: ${{ inputs.recheck }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect
        run: |
          set -euo pipefail
          ARGS=(run "$SOURCE" --recheck "$RECHECK")
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$SERIES" ]; then ARGS+=(--series "$SERIES"); fi
          python -m dome_open_data "${ARGS[@]}"
      - name: Verify
        run: |
          set -euo pipefail
          if [ -n "$SERIES" ]; then
            python -m dome_open_data verify "$SOURCE" --series "$SERIES"
          else
            python -m dome_open_data verify "$SOURCE"
          fi
